<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Focus Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#a5b4fc" stroke-width="8" stroke-dasharray="24 16" opacity="0.6" />
  
  <!-- Shackle -->
  <path d="M 196 220 V 160 A 60 60 0 0 1 316 160 V 220" fill="none" stroke="url(#lockGrad)" stroke-width="28" stroke-linecap="round" />
  
  <!-- Lock Body -->
  <rect x="160" y="220" width="192" height="150" rx="36" fill="url(#lockGrad)" filter="url(#shadow)" />
  
  <!-- Center Keyhole / Target -->
  <circle cx="256" cy="285" r="22" fill="#4f46e5" />
  <path d="M 248 295 L 264 295 L 268 335 L 244 335 Z" fill="#4f46e5" />
</svg>
